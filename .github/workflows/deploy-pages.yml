name: Deploy Kortex Web Portal to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Inject SUPABASE_URL and SUPABASE_KEY into docs/supabase-config.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || vars.SUPABASE_KEY }}
        run: |
          npm run build:web-config
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "### ⚠️ Variables de Supabase pendientes" >> $GITHUB_STEP_SUMMARY
            echo "Agregá **SUPABASE_URL** y **SUPABASE_KEY** (clave pública \`anon\` / \`publishable\`) en **Settings → Secrets and variables → Actions** para activar OAuth2 de Discord y Realtime en GitHub Pages." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Cliente de Supabase inyectado para GitHub Pages" >> $GITHUB_STEP_SUMMARY
            echo "Configuración generada correctamente con **SUPABASE_URL** y **SUPABASE_KEY**." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
