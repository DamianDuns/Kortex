<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101a"/>
      <stop offset="50%" stop-color="#111625"/>
      <stop offset="100%" stop-color="#0b0e17"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="420" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="796" height="416" rx="13" fill="none" stroke="#252d43" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="20" y="16" width="760" height="46" rx="8" fill="#151b2c" stroke="#2a344f" stroke-width="1"/>
  <circle cx="42" cy="39" r="6" fill="#22c55e"/>
  <text x="58" y="44" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold">🏗️ /tycoon — Categoría 1: Mi Estudio 3D Roblox</text>
  <text x="760" y="44" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" text-anchor="end">Motor Isométrico Skia • Nivel 1/6 • 45 Tix/min</text>

  <!-- Content -->
  
  <!-- Left Panel: Isometric Platform & Character -->
  <rect x="20" y="74" width="460" height="326" rx="10" fill="#161d31" stroke="#2d3752" stroke-width="1.2"/>
  <!-- Isometric floor -->
  <polygon points="250,130 420,210 250,290 80,210" fill="#1c253d" stroke="#3b4869" stroke-width="1.5"/>
  <polygon points="80,210 250,290 250,305 80,225" fill="#141a2c"/>
  <polygon points="250,290 420,210 420,225 250,305" fill="#0f1422"/>
  <!-- Conveyor in L -->
  <polygon points="200,180 270,145 285,155 215,190" fill="#334155" stroke="#475569" stroke-width="1"/>
  <!-- Character Base -->
  <ellipse cx="250" cy="225" rx="36" ry="16" fill="rgba(167,139,250,0.25)"/>
  <rect x="236" y="160" width="28" height="42" rx="4" fill="#38bdf8"/>
  <rect x="240" y="142" width="20" height="18" rx="4" fill="#fde047"/>
  <rect x="226" y="162" width="10" height="36" rx="3" fill="#0284c7"/>
  <rect x="264" y="162" width="10" height="36" rx="3" fill="#0284c7"/>
  <rect x="238" y="202" width="11" height="26" rx="2" fill="#1e293b"/>
  <rect x="251" y="202" width="11" height="26" rx="2" fill="#1e293b"/>
  <!-- Collector Vault -->
  <rect x="350" y="240" width="60" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="265" fill="#fde047" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BÓVEDA</text>

  <!-- Right Panel: Stats & Economy -->
  <rect x="495" y="74" width="285" height="326" rx="10" fill="#161d31" stroke="#2d3752" stroke-width="1.2"/>
  <text x="515" y="105" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">ESTADÍSTICAS DEL ESTUDIO</text>
  
  <rect x="515" y="122" width="245" height="52" rx="8" fill="#1c253d" stroke="#334155" stroke-width="1"/>
  <text x="530" y="145" fill="#94a3b8" font-family="sans-serif" font-size="11">Moneda Activa (Tix)</text>
  <text x="530" y="164" fill="#ef4444" font-family="sans-serif" font-size="16" font-weight="bold">🎟️ 1.250 Tix</text>

  <rect x="515" y="186" width="245" height="52" rx="8" fill="#1c253d" stroke="#334155" stroke-width="1"/>
  <text x="530" y="209" fill="#94a3b8" font-family="sans-serif" font-size="11">Renta Pasiva</text>
  <text x="530" y="228" fill="#4ade80" font-family="sans-serif" font-size="16" font-weight="bold">+45 Tix / minuto</text>

  <rect x="515" y="250" width="245" height="52" rx="8" fill="#1c253d" stroke="#334155" stroke-width="1"/>
  <text x="530" y="273" fill="#94a3b8" font-family="sans-serif" font-size="11">Cristales Kortex</text>
  <text x="530" y="292" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">💠 14 Cristales</text>

  <rect x="515" y="318" width="245" height="66" rx="8" fill="rgba(34,197,94,0.12)" stroke="#22c55e" stroke-width="1.2"/>
  <text x="530" y="342" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">Progreso a Rebirth #1</text>
  <rect x="530" y="352" width="215" height="10" rx="5" fill="#141a2c"/>
  <rect x="530" y="352" width="150" height="10" rx="5" fill="#22c55e"/>
  <text x="735" y="375" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="end">70% completado</text>

</svg>